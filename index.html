<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#062f5f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="src/styles.css" />
  <title>Eixo Oeste — Inspeção AMV</title>
</head>
<body>
  <header class="topbar">
    <img src="assets/logo_rjp_amv.png" alt="RJP" class="logo" />
    <div>
      <h1>Eixo Oeste</h1>
      <p>Manutenção Ferroviária · Inspeção de AMV</p>
      <small>Autor: <strong>RJP</strong></small>
    </div>
  </header>

  <main class="app">
    <section class="hero card">
      <img src="assets/logo_rjp_amv.png" alt="Logótipo RJP AMV" />
      <h2>Inspeção de Aparelhos de Mudança de Via</h2>
      <p>Ficha vertical inspirada na filosofia EBTCC, preparada para adaptar os templates Excel IP.MOD.052 e IP.MOD.057.</p>
      <div class="grid-actions">
        <button onclick="newInspection()">+ Nova Inspeção</button>
        <button onclick="saveInspection()" class="green">Guardar</button>
        <button onclick="exportJson()" class="gray">Exportar JSON</button>
        <button onclick="window.print()" class="orange">Gerar PDF</button>
      </div>
    </section>

    <section class="status-row">
      <div class="pill ok">Operacional</div>
      <div class="pill warn">Anomalias: <span id="warnCount">0</span></div>
      <div class="pill sync" onclick="fakeSync()">Sincronizar</div>
    </section>

    <form id="inspectionForm" class="form"></form>
  </main>

  <nav class="bottomnav">
    <button onclick="scrollToTop()">Início</button>
    <button onclick="openFirstSection('Identificação do AMV')">AMV</button>
    <button onclick="openFirstSection('Fotografias')">Fotos</button>
    <button onclick="openFirstSection('Não Conformidades')">Alertas</button>
    <button onclick="openSettings()">Definições</button>
  </nav>

  <script src="src/app.js"></script>
</body>
</html>
