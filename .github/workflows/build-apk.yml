name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: |
          npm install
          npm install -D typescript

      - name: Preparar pasta www
        run: |
          rm -rf www
          mkdir -p www
          cp index.html manifest.webmanifest service-worker.js www/ 2>/dev/null || true
          cp -r assets src www/ 2>/dev/null || true
          if [ ! -f www/index.html ]; then
            echo "<!doctype html><html><body><h1>Eixo Oeste AMV</h1></body></html>" > www/index.html
          fi

      - name: Criar capacitor.config.ts
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'rjp.eixooeste.amv',
            appName: 'Eixo Oeste AMV',
            webDir: 'www'
          };

          export default config;
          EOF

      - name: Criar Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Aplicar nome e ícone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import xml.etree.ElementTree as ET

          # Android label
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          txt = manifest.read_text()
          txt = txt.replace('android:label="@string/app_name"', 'android:label="Eixo Oeste AMV"')
          txt = txt.replace('android:label="Eixo Oeste AMV"', 'android:label="Eixo Oeste AMV"')
          manifest.write_text(txt)

          # Icons
          src = Path("assets/1024.png")
          if not src.exists():
              src = Path("assets/play_store_512.png")
          if src.exists():
              im = Image.open(src).convert("RGBA")
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192,
              }
              for folder, size in sizes.items():
                  d = Path("android/app/src/main/res") / folder
                  d.mkdir(parents=True, exist_ok=True)
                  im.resize((size, size), Image.LANCZOS).save(d / "ic_launcher.png")
                  im.resize((size, size), Image.LANCZOS).save(d / "ic_launcher_round.png")
          PY

      - name: Aceitar licenças Android
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Instalar SDK necessário
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-36" \
          "build-tools;35.0.0"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Eixo_Oeste_AMV_RJP_debug_apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
